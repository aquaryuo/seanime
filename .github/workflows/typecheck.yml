name: typecheck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save typescript@7 esbuild@0.28
      - name: Typecheck every payload
        run: |
          rc=0
          for cfg in extensions/*/tsconfig.json; do
            echo "--- $cfg"
            npx tsc --noEmit --project "$cfg" || rc=1
          done
          exit $rc
      - name: Pure provider logic, on the payloads as the host transforms them
        if: always()
        run: node tools/pure.test.mjs

  version-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every changed payload must carry a manifest bump
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "no previous tip for this push — nothing to compare"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "$BEFORE^{commit}" > /dev/null; then
            echo "previous tip $BEFORE is unreachable (history was rewritten) — skipping"
            exit 0
          fi
          ver() { git show "$1" 2>/dev/null | jq -r '.version // empty' || true; }
          changed=$(git diff --name-only --diff-filter=d "$BEFORE" "$AFTER")
          rc=0
          for f in $(echo "$changed" | grep -E '^extensions/[^/]+/provider\.ts$' || true); do
            dir=$(dirname "$f")
            old=$(ver "$BEFORE:$dir/manifest.json")
            new=$(ver "$AFTER:$dir/manifest.json")
            if [ -z "$new" ]; then
              echo "$dir/manifest.json has no readable version" >&2
              rc=1
            elif [ "$old" = "$new" ]; then
              echo "$f changed but $dir/manifest.json version stayed at $new" >&2
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "" >&2
            echo "Users pull the payload from the branch tip but only refetch when manifest.version changes," >&2
            echo "so a payload change without a bump reaches nobody and makes the version meaningless." >&2
          fi
          exit $rc
      - name: marketplace.json matches the manifests
        if: always()
        run: node tools/gen-marketplace.mjs --check
