name: typecheck
# Users pull provider.ts and plugin.ts straight from this branch, so a type error
# reaches them before anyone runs the code. Every payload has its own tsconfig
# (strict, noEmit); check them all.
on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pinned to the major the payloads were verified against; a silent bump to a
      # stricter compiler would fail the gate on unchanged code.
      - run: npm install --no-save typescript@6 esbuild@0.28
      - name: Typecheck every payload
        run: |
          set -euo pipefail
          rc=0
          for cfg in plugins/*/tsconfig.json extensions/*/tsconfig.json; do
            [ -f "$cfg" ] || continue
            echo "--- $cfg"
            npx tsc --noEmit --project "$cfg" || rc=1
          done
          exit $rc
      # The host transforms every payload with esbuild before running it, reading the
      # source as a string. Reproducing that transform exactly is the only check that
      # cannot disagree with production: whatever it rejects would fail to load.
      - name: Transform every payload the way the host does
        if: always()
        run: |
          set -euo pipefail
          rc=0
          n=0
          for f in extensions/*/provider.ts plugins/*/plugin.ts; do
            [ -f "$f" ] || continue
            echo "--- $f"
            n=$((n + 1))
            npx esbuild --loader=ts --target=es2018 --minify-whitespace --minify-syntax < "$f" > /dev/null || rc=1
          done
          # A glob that matches nothing would otherwise report success having checked
          # nothing at all, which is the failure this gate exists to catch. The count
          # itself differs per branch — beta carries payloads main does not.
          if [ "$n" -eq 0 ]; then
            echo "no payloads matched — the layout moved and this gate checked nothing" >&2
            rc=1
          fi
          exit $rc
