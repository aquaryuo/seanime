name: typecheck
on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save typescript@7 esbuild@0.28
      - name: Typecheck every payload
        run: |
          set -euo pipefail
          rc=0
          for cfg in plugins/*/tsconfig.json extensions/*/tsconfig.json; do
            [ -f "$cfg" ] || continue
            echo "--- $cfg"
            npx tsc --noEmit --project "$cfg" || rc=1
          done
          exit $rc
      - name: Transform every payload the way the host does
        if: always()
        run: |
          set -euo pipefail
          rc=0
          n=0
          for f in extensions/*/provider.ts plugins/*/plugin.ts; do
            [ -f "$f" ] || continue
            echo "--- $f"
            n=$((n + 1))
            npx esbuild --loader=ts --target=es2018 --minify-whitespace --minify-syntax < "$f" > /dev/null || rc=1
          done
          if [ "$n" -eq 0 ]; then
            echo "no payloads matched — the layout moved and this gate checked nothing" >&2
            rc=1
          fi
          exit $rc

  version-gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every changed payload must carry a manifest bump
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "no previous tip for this push — nothing to compare"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "$BEFORE^{commit}" > /dev/null; then
            echo "previous tip $BEFORE is unreachable (history was rewritten) — skipping"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          [ -n "$changed" ] || exit 0
          rc=0
          for f in $(echo "$changed" | grep -E '^(extensions|plugins)/[^/]+/(provider|plugin)\.ts$' || true); do
            dir=$(dirname "$f")
            if ! echo "$changed" | grep -qx "$dir/manifest.json"; then
              echo "$f changed without a bump in $dir/manifest.json" >&2
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "" >&2
            echo "Users pull the payload from the branch tip but only refetch when manifest.version changes," >&2
            echo "so a payload change without a bump reaches nobody and makes the version meaningless." >&2
          fi
          exit $rc
      - name: marketplace.json matches the manifests
        if: always()
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main || true
          node tools/gen-marketplace.mjs --check
